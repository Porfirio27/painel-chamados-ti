[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#eef2f8"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Serve a pasta static/ em /app/static/ (ícones e manifest.json do app)
enableStaticServing = true
